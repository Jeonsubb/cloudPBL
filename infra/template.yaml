AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PortPulse MVP serverless architecture

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        AWS_REGION: !Ref AWS::Region
        UPLOAD_BUCKET_NAME: !Ref UploadBucket
        RAW_DATA_BUCKET_NAME: !Ref RawDataBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId

Parameters:
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-sonnet-20240620-v1:0
    Description: Amazon Bedrock model id

Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
            AllowedOrigins:
              - "*"
            MaxAge: 3000

  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  PortPulseUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: portpulse-user-pool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false

  PortPulseUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: portpulse-web-client
      UserPoolId: !Ref PortPulseUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  PortPulseApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: handlers.upload_url.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortPulseApi
            Path: /api/uploads/presigned-url
            Method: POST

  ShipmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: handlers.shipment.handler
      Events:
        ListShipments:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortPulseApi
            Path: /api/shipments
            Method: GET
        CreateShipment:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortPulseApi
            Path: /api/shipments
            Method: POST

  RiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: handlers.risk.handler
      Events:
        CalculateRisk:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortPulseApi
            Path: /api/risk
            Method: POST

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: handlers.chat.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: "*"
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortPulseApi
            Path: /api/chat
            Method: POST

  ParseDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: handlers.parse_document.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket

  IngestMarketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: handlers.ingest_market.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref RawDataBucket
      Events:
        DailyMarketIngest:
          Type: Schedule
          Properties:
            Schedule: cron(0 0 * * ? *)
            Description: Daily market data ingest at 09:00 KST
            Enabled: true

  AlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: handlers.alert.handler
      Events:
        Alert:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortPulseApi
            Path: /api/alerts
            Method: POST

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint
    Value: !Sub "https://${PortPulseApi}.execute-api.${AWS::Region}.amazonaws.com"
  UploadBucketName:
    Description: S3 bucket for user uploaded files
    Value: !Ref UploadBucket
  RawDataBucketName:
    Description: S3 bucket for raw market data
    Value: !Ref RawDataBucket
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref PortPulseUserPool
  CognitoClientId:
    Description: Cognito Web Client ID
    Value: !Ref PortPulseUserPoolClient
