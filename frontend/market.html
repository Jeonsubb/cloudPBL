<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PortPulse — 시황</title>
<link rel="stylesheet" href="common.css?v=7" />
</head>
<body>
<div class="wrap">
  <div id="headerMount"></div>
  <div id="navMount"></div>

  <div class="section-title">해운 운임 지수</div>
  <div id="hero"></div>

  <div class="section-title">환율 · 금리</div>
  <div class="grid" id="grid"></div>

  <div id="apiLabel" class="foot" style="margin-top:28px;"></div>
</div>

<button id="chatFab" type="button" title="PortPulse AI 어시스턴트">💬</button>
<div id="chatPanel">
  <div class="chat-head">
    <div>
      <div class="title">🤖 PortPulse 어시스턴트</div>
      <div class="sub">시장·뉴스·선적 현황 기반 · AI 참고 의견</div>
    </div>
    <button type="button" id="chatCloseBtn" aria-label="닫기">×</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="예: 오늘 KCCI 어때? 긴급한 선적 있어?" />
    <button type="button" id="chatSendBtn">➤</button>
  </div>
</div>

<script src="common.js?v=7"></script>
<script>
async function main() {
  renderBrandHeader();
  renderNav("market");
  document.getElementById("apiLabel").textContent = `API: ${API_URL}`;
  initChat();
  const ok = await loadMarketSeries("hero", "grid");
  const now = new Date();
  document.getElementById("updated").innerHTML = ok
    ? `<strong>${now.toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" })}</strong> 기준<br>AWS API Gateway → Lambda → DynamoDB 실시간 조회`
    : `<span class="err">API 연결 실패</span>`;
}
main();
</script>
</body>
</html>
