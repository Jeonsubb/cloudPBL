<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PortPulse — 수출입 시황 대시보드</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e6eaf2;
    --ink: #0f172a;
    --muted: #64748b;
    --faint: #94a3b8;
    --line: #2563eb;
    --up: #e11d48;
    --down: #2563eb;
    --flat: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; }

  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); box-shadow: 0 0 0 4px rgba(37,99,235,.15); }
  .brand h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .brand .tag { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .updated { font-size: 12px; color: var(--faint); text-align: right; }
  .updated strong { color: var(--muted); font-weight: 600; }

  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.02em; margin: 32px 4px 12px; text-transform: uppercase; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0; }
  .card .src { font-size: 11px; color: var(--faint); }
  .value-row { display: flex; align-items: baseline; gap: 10px; margin: 12px 0 2px; }
  .value { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .value .unit { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 3px; }
  .chip { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .chip.up { color: var(--up); background: rgba(225,29,72,.09); }
  .chip.down { color: var(--down); background: rgba(37,99,235,.09); }
  .chip.flat { color: var(--flat); background: rgba(100,116,139,.1); }
  .range-caption { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

  .rangebar { display: flex; gap: 5px; margin: 14px 0 6px; }
  .rangebar button { border: 1px solid var(--border); background: #fff; color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px; cursor: pointer; transition: all .12s; }
  .rangebar button:hover { border-color: var(--faint); color: var(--ink); }
  .rangebar button.active { background: var(--line); border-color: var(--line); color: #fff; }

  svg.chart { width: 100%; height: auto; display: block; margin-top: 6px; }
  .foot { font-size: 11px; color: var(--faint); margin-top: 8px; }
  .loading, .err { font-size: 13px; color: var(--muted); padding: 24px 0; text-align: center; }
  .err { color: var(--up); }

  .hero .value { font-size: 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }

  /* 뉴스 */
  .news-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .news-list li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid #f1f5f9; }
  .news-list li:first-child { border-top: none; padding-top: 4px; }
  .news-list .rank { color: var(--line); font-weight: 800; font-size: 13px; min-width: 18px; text-align: center; flex-shrink: 0; line-height: 1.5; }
  .news-list .nbody { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .news-list a { color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.5; font-weight: 500; }
  .news-list a:hover { color: var(--line); }
  .news-list .src { font-size: 11.5px; color: var(--faint); }
  #newsMoreBtn { margin-top: 14px; width: 100%; border: 1px solid var(--border); background: #fff; color: var(--muted); font-size: 13px; font-weight: 600; padding: 9px; border-radius: 10px; cursor: pointer; }
  #newsMoreBtn:hover { border-color: var(--faint); color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>PortPulse</h1>
        <div class="tag">수출입 기업을 위한 해운 운임·환율·시황 대시보드</div>
      </div>
    </div>
    <div class="updated" id="updated">불러오는 중…</div>
  </header>

  <div class="section-title">오늘의 해운 뉴스</div>
  <div class="card">
    <ul class="news-list" id="newsList"><li class="loading">불러오는 중…</li></ul>
    <button type="button" id="newsMoreBtn" style="display:none;">더보기</button>
  </div>

  <div class="section-title">해운 운임 지수</div>
  <div id="hero"></div>

  <div class="section-title">환율 · 금리</div>
  <div class="grid" id="grid"></div>

  <div id="apiLabel" class="foot" style="margin-top:28px;"></div>
</div>

<script>
const API_URL = window.location.search.includes("api=")
  ? new URLSearchParams(window.location.search).get("api")
  : "https://t7ggohc5tb.execute-api.ap-northeast-2.amazonaws.com";

// ECOS 매매기준율/기준금리는 영업일 1회 고시 공식값이라 장중 실시간 틱은 없다 → 최소 단위 1주.
const RANGES = [
  { key: "1w", label: "1주", days: 7 },
  { key: "1m", label: "1개월", days: 30 },
  { key: "1y", label: "1년", days: 365 },
  { key: "3y", label: "3년", days: 1095 },
  { key: "max", label: "전체", days: 20000 },
];
// 기준금리는 금통위 결정 시에만 바뀌어 짧은 창은 평평 → 기본 전체. 나머지는 1년.
const CONFIG = {
  KCCI:          { defaultRange: "1y",  decimals: 0 },
  FX_USD_KRW:    { defaultRange: "1y",  decimals: 2 },
  FX_JPY_KRW:    { defaultRange: "1y",  decimals: 2 },
  FX_EUR_KRW:    { defaultRange: "1y",  decimals: 2 },
  FX_CNY_KRW:    { defaultRange: "1y",  decimals: 2 },
  BOK_BASE_RATE: { defaultRange: "max", decimals: 2 },
};

const fmtNum = (v, d = 2) => v.toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });

/* ---------- 차트 ---------- */
const W = 480, H = 200, PAD = { top: 14, right: 16, bottom: 26, left: 58 };

function niceTicks(min, max, count = 4) {
  if (min === max) { const p = Math.abs(min) * 0.05 || 1; min -= p; max += p; }
  const span = max - min;
  const step = 10 ** Math.floor(Math.log10(span / count));
  const err = span / count / step;
  const mult = err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
  const tick = step * mult;
  const lo = Math.floor(min / tick) * tick, hi = Math.ceil(max / tick) * tick;
  const ticks = [];
  for (let v = lo; v <= hi + tick / 2; v += tick) ticks.push(Number(v.toFixed(10)));
  return { ticks, lo, hi };
}

// 기간 길이에 맞춰 x축 라벨 포맷을 바꾼다(원시 날짜 나열 방지).
function fmtDate(dateStr, spanDays) {
  const [y, m, d] = dateStr.split("-");
  if (spanDays <= 45) return `${+m}/${+d}`;
  if (spanDays <= 400) return `${y.slice(2)}.${+m}`;
  return `'${y.slice(2)}`;
}

function renderChart(points, decimals) {
  const values = points.map((p) => p.value);
  const { ticks, lo, hi } = niceTicks(Math.min(...values), Math.max(...values));
  const plotW = W - PAD.left - PAD.right, plotH = H - PAD.top - PAD.bottom;
  const spanDays = points.length > 1
    ? (new Date(points.at(-1).date) - new Date(points[0].date)) / 86400000 : 1;
  const x = (i) => PAD.left + (points.length === 1 ? plotW / 2 : (i / (points.length - 1)) * plotW);
  const y = (v) => PAD.top + plotH - ((v - lo) / (hi - lo)) * plotH;

  const line = points.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const area = `${line} L${x(points.length - 1).toFixed(1)},${(PAD.top + plotH).toFixed(1)} L${x(0).toFixed(1)},${(PAD.top + plotH).toFixed(1)} Z`;

  const grid = ticks.map((t) =>
    `<line x1="${PAD.left}" y1="${y(t).toFixed(1)}" x2="${W - PAD.right}" y2="${y(t).toFixed(1)}" stroke="#eef2f7"/>` +
    `<text x="${PAD.left - 9}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#94a3b8">${fmtNum(t, decimals)}</text>`
  ).join("");

  const xCount = Math.min(5, points.length);
  const xLabels = Array.from({ length: xCount }, (_, k) => {
    const i = Math.round((k / (xCount - 1 || 1)) * (points.length - 1));
    return `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="#94a3b8">${fmtDate(points[i].date, spanDays)}</text>`;
  }).join("");

  const last = points.at(-1);
  const gid = "g" + Math.random().toString(36).slice(2, 8);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${xLabels}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(points.length - 1).toFixed(1)}" cy="${y(last.value).toFixed(1)}" r="3.5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/>
  </svg>`;
}

function changeInfo(points, rangeLabel, decimals) {
  const first = points[0], last = points.at(-1);
  const diff = last.value - first.value;
  const pct = first.value ? (diff / first.value) * 100 : 0;
  const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "—";
  const sign = diff >= 0 ? "+" : "−";
  return {
    cls,
    chip: `${arrow} ${sign}${fmtNum(Math.abs(diff), decimals)} (${sign}${Math.abs(pct).toFixed(2)}%)`,
    caption: `${rangeLabel} · ${first.date} → ${last.date}`,
  };
}

/* ---------- 카드 ---------- */
function makeCard(meta, hero) {
  const card = document.createElement("div");
  card.className = "card" + (hero ? " hero" : "");
  const rangeBtns = RANGES.map((r) => `<button type="button" data-range="${r.key}">${r.label}</button>`).join("");
  card.innerHTML = `
    <div class="card-head">
      <h2>${meta.label}</h2>
      <span class="src">${meta.source}</span>
    </div>
    <div class="rangebar">${rangeBtns}</div>
    <div class="body"><div class="loading">불러오는 중…</div></div>`;
  const cfg = CONFIG[meta.id] ?? { defaultRange: "1y", decimals: 2 };
  const load = (rangeKey) => loadCard(card, meta, rangeKey, cfg);
  card.querySelectorAll("[data-range]").forEach((btn) => btn.addEventListener("click", () => load(btn.dataset.range)));
  load(cfg.defaultRange);
  return card;
}

async function loadCard(card, meta, rangeKey, cfg) {
  const range = RANGES.find((r) => r.key === rangeKey) ?? RANGES[2];
  card.querySelectorAll("[data-range]").forEach((b) => b.classList.toggle("active", b.dataset.range === range.key));
  const body = card.querySelector(".body");
  body.innerHTML = `<div class="loading">불러오는 중…</div>`;
  try {
    const data = await (await fetch(`${API_URL}/series/${meta.id}?days=${range.days}`)).json();
    if (!data.points || data.points.length === 0) { body.innerHTML = `<div class="err">데이터 없음</div>`; return; }
    const last = data.points.at(-1);
    const info = changeInfo(data.points, range.label, cfg.decimals);
    body.innerHTML = `
      <div class="value-row">
        <span class="value">${fmtNum(last.value, cfg.decimals)}<span class="unit">${meta.unit}</span></span>
        <span class="chip ${info.cls}">${info.chip}</span>
      </div>
      <div class="range-caption">${info.caption}</div>
      ${renderChart(data.points, cfg.decimals)}
      <div class="foot">최종 관측일 ${last.date} · 관측치 ${data.points.length.toLocaleString("ko-KR")}건 · ${meta.source}</div>`;
  } catch (e) {
    body.innerHTML = `<div class="err">조회 실패: ${e.message}</div>`;
  }
}

/* ---------- 뉴스 ---------- */
const NEWS_PAGE_SIZE = 10;
const news = { date: null, limit: NEWS_PAGE_SIZE, shown: [], noMoreData: false };
function shiftDate(dateStr, delta) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + delta)).toISOString().slice(0, 10);
}
async function fetchNewsPage(date, limit) {
  const url = new URL(`${API_URL}/news/top`);
  if (date) url.searchParams.set("date", date);
  url.searchParams.set("limit", limit);
  return (await fetch(url)).json();
}
function renderNews() {
  const list = document.getElementById("newsList");
  const btn = document.getElementById("newsMoreBtn");
  if (news.shown.length === 0) { list.innerHTML = `<li class="err">최근 수집된 뉴스가 없습니다</li>`; btn.style.display = "none"; return; }
  list.innerHTML = news.shown.map((it, i) => `
    <li>
      <span class="rank">${i + 1}</span>
      <div class="nbody">
        <a href="${it.link}" target="_blank" rel="noopener">${it.title}</a>
        <span class="src">${it.source} · ${it.pubDate.slice(5, 16)}</span>
      </div>
    </li>`).join("");
  btn.style.display = news.noMoreData ? "none" : "block";
}
async function loadNews() {
  try {
    // 오늘이 아직 비어 있을 수 있어(아침·주말) 최근 데이터가 있는 날까지 최대 7일 후퇴.
    let data = await fetchNewsPage(null, NEWS_PAGE_SIZE);
    let date = data.date;
    for (let back = 0; back < 7 && data.items.length === 0; back++) {
      date = shiftDate(date, -1);
      data = await fetchNewsPage(date, NEWS_PAGE_SIZE);
    }
    news.date = date; news.limit = NEWS_PAGE_SIZE; news.shown = data.items; news.noMoreData = false;
    renderNews();
  } catch (e) { document.getElementById("newsList").innerHTML = `<li class="err">뉴스 조회 실패: ${e.message}</li>`; }
}
async function loadMoreNews() {
  const btn = document.getElementById("newsMoreBtn");
  btn.textContent = "불러오는 중…";
  try {
    const tried = news.limit + NEWS_PAGE_SIZE;
    const data = await fetchNewsPage(news.date, tried);
    if (data.items.length > news.shown.length) {
      news.limit = tried; news.shown = data.items;
    } else {
      const prev = shiftDate(news.date, -1);
      const prevData = await fetchNewsPage(prev, NEWS_PAGE_SIZE);
      if (prevData.items.length === 0) news.noMoreData = true;
      else { news.date = prev; news.limit = NEWS_PAGE_SIZE; news.shown = [...news.shown, ...prevData.items]; }
    }
  } catch (e) { /* keep list */ }
  btn.textContent = "더보기";
  renderNews();
}

/* ---------- 부트 ---------- */
async function main() {
  document.getElementById("apiLabel").textContent = `API: ${API_URL}`;
  document.getElementById("newsMoreBtn").addEventListener("click", loadMoreNews);
  loadNews();

  let list;
  try {
    list = await (await fetch(`${API_URL}/series`)).json();
  } catch (e) {
    document.getElementById("updated").innerHTML = `<span class="err">API 연결 실패</span>`;
    return;
  }
  const hero = document.getElementById("hero");
  const grid = document.getElementById("grid");
  for (const meta of list) {
    if (meta.category === "shipping") hero.appendChild(makeCard(meta, true));
    else grid.appendChild(makeCard(meta, false));
  }
  const now = new Date();
  document.getElementById("updated").innerHTML =
    `<strong>${now.toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" })}</strong> 기준<br>AWS API Gateway → Lambda → DynamoDB 실시간 조회`;
}
main();
</script>
</body>
</html>
