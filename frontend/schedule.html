<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PortPulse — 운항 일정</title>
<link rel="stylesheet" href="common.css?v=17" />
</head>
<body>
<div class="wrap schedule-page">
  <div id="headerMount"></div>
  <div id="navMount"></div>

  <div class="page-intro">
    <span class="eyebrow">SAILING SCHEDULE</span>
    <h2>출발지와 목적지로 운항 일정을 찾아보세요.</h2>
    <p>노선을 선택하면 출항일, 도착일, 직항 여부와 참고 운임을 한눈에 비교할 수 있습니다.</p>
  </div>

  <section class="schedule-finder">
    <div id="scheduleFilters" class="schedule-filters"><div class="loading">노선 정보를 불러오는 중…</div></div>
    <div id="scheduleResults"></div>
  </section>
  <p class="service-note">운항 일정은 공개 스케줄을 기준으로 주기적으로 갱신됩니다. 표시 운임은 확정 견적이 아닌 비교용 참고값이며 실제 계약 조건에 따라 달라질 수 있습니다.</p>
</div>

<button id="chatFab" type="button" title="PortPulse AI 어시스턴트">💬</button>
<div id="chatPanel">
  <div class="chat-head"><div><div class="title">PortPulse 어시스턴트</div><div class="sub">시장·뉴스·회사 선적을 함께 확인합니다</div></div><button type="button" id="chatCloseBtn" aria-label="닫기">×</button></div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input-row"><input type="text" id="chatInput" placeholder="예: 함부르크행 일정 중 직항만 알려줘" /><button type="button" id="chatSendBtn" aria-label="전송">➤</button></div>
</div>

<script src="common.js?v=17"></script>
<script>
function main() {
  renderBrandHeader();
  renderNav("schedule");
  document.getElementById("updated").textContent = "가까운 출항 일정 기준";
  initChat();
  renderScheduleExplorer("scheduleFilters", "scheduleResults");
}
main();
</script>
</body>
</html>
