<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PortPulse — 선적 의사결정</title>
<link rel="stylesheet" href="common.css?v=17" />
</head>
<body>
<div class="wrap">
  <div id="headerMount"></div>
  <div id="navMount"></div>

  <div class="page-intro"><span class="eyebrow">DECISION EXAMPLE</span><h2>선적 의사결정 예시</h2><p>견적과 납기 조건을 비교하는 방식을 예시 데이터로 확인할 수 있습니다.</p></div>
  <div id="portfolioSummary" class="kpi-strip"></div>
  <div id="decisions"><div class="loading">불러오는 중…</div></div>

</div>

<button id="chatFab" type="button" title="PortPulse AI 어시스턴트">💬</button>
<div id="chatPanel">
  <div class="chat-head">
    <div>
      <div class="title">🤖 PortPulse 어시스턴트</div>
      <div class="sub">시장·뉴스·선적 현황 기반 · AI 참고 의견</div>
    </div>
    <button type="button" id="chatCloseBtn" aria-label="닫기">×</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="예: 오늘 KCCI 어때? 긴급한 선적 있어?" />
    <button type="button" id="chatSendBtn">➤</button>
  </div>
</div>

<script src="common.js?v=19"></script>
<script>
function main() {
  renderBrandHeader();
  renderNav("shipments");
  document.getElementById("updated").textContent = "선적 판단 방식 예시";
  initChat();
  loadDecisions("decisions", "portfolioSummary");
}
main();
</script>
</body>
</html>
